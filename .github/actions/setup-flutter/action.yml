# SPDX-License-Identifier: GPL-3.0-or-later
name: Setup Flutter workspace
description: Installs the Flutter version pinned in .fvmrc and resolves the workspace.
runs:
  using: composite
  steps:
    - name: Read pinned Flutter version
      id: version
      shell: bash
      run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Install Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ steps.version.outputs.flutter }}
        cache: true

    # `flutter pub get` generates the l10n package's synthetic output and needs
    # its (git-ignored) merged ARB files to exist.
    - name: Merge ARB files (needed by pub get)
      shell: bash
      run: dart packages/l10n/tool/build_l10n.dart --arb-only

    - name: Resolve dependencies
      shell: bash
      run: |
        flutter config --no-analytics
        flutter pub get

    # Generated code is never committed (tools/ci/repo_guard.sh rejects tracked
    # *.g.dart; the event catalog and the merged localizations are git-ignored
    # too). Every job that analyzes, tests or builds needs it.
    - name: Generate code (events, localizations, drift; git-ignored)
      shell: bash
      run: dart run melos run codegen
