# SPDX-License-Identifier: GPL-3.0-or-later
#
# Signed release: builds both flavours, signs them with the release key and
# creates a DRAFT GitHub Release. The owner reviews and publishes it by hand.
# See docs/releasing.md for the one-time setup (keystore, environment secrets,
# environment protection) and the release procedure.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0. Run this workflow FROM that tag."
        required: true
        type: string

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ env.TAG }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on main and matches the pubspec versions
        id: check
        run: |
          set -euo pipefail
          # The code that runs must be the code at the tag, so a manual run
          # has to be started from the tag itself, never from a branch.
          if [ "$GITHUB_REF" != "refs/tags/${TAG}" ]; then
            echo "::error::Run this workflow from the tag ${TAG} (got ${GITHUB_REF})."
            exit 1
          fi
          version="$(bash tools/release/check_version.sh "$TAG" apps/consolarr/pubspec.yaml apps/consolarr_play/pubspec.yaml)"
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$sha" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked-out commit is not the tag commit."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::Tag ${TAG} (${sha}) is not on main."
            exit 1
          fi
          echo "Tag ${TAG} is on main and matches version ${version}."
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required reviewers on this environment give every release a manual
    # approval. The four signing secrets exist only here.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # Tag refs never write the cache.
          cache-read-only: true
          build-scan-publish: false
          dependency-graph: disabled
          add-job-summary-as-pr-comment: never
      - uses: ./.github/actions/setup-flutter

      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          bash tools/release/prepare_signing.sh "$RUNNER_TEMP/signing"
          apps/consolarr/android apps/consolarr_play/android

      - name: Build both flavours (release, obfuscated, gated)
        run: >-
          bash tools/release/build_release.sh "$TAG"
          "$RUNNER_TEMP/release" "$RUNNER_TEMP/debug-info"

      - name: Verify signatures; record the certificate digest
        run: |
          set -euo pipefail
          export APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          cd "$RUNNER_TEMP/release"
          bash "$GITHUB_WORKSPACE/tools/release/verify_signature.sh" SIGNING-CERT-SHA256.txt -- ./*.apk
          sha256sum -- ./*.apk | sed 's|  \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Release ${TAG}"
            echo "Signing certificate SHA-256: \`$(cat SIGNING-CERT-SHA256.txt)\`"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/SIGNING-CERT-SHA256.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      # Obfuscation symbols, kept only for crash symbolication. They are not
      # release assets.
      - name: Upload debug-info (symbols)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-info-${{ env.TAG }}
          path: ${{ runner.temp }}/debug-info/
          retention-days: 90
          if-no-files-found: error

      - name: Remove keystore and key.properties
        if: always()
        run: >-
          bash tools/release/cleanup_signing.sh "$RUNNER_TEMP/signing"
          apps/consolarr/android apps/consolarr_play/android

  attest:
    name: Build provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No checkout, no environment, no secrets: only what attestation needs.
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.apk

  publish:
    name: Draft GitHub Release
    needs: [verify, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Check the files, then create the draft release
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists. Delete it (and keep the tag) before re-running."
            exit 1
          fi

          # Previous version tag, for release notes "since the last release".
          previous="$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed 's|^refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | { cat; echo "$TAG"; } | sort -uV \
            | grep -B1 -x "$TAG" | head -n1 || true)"
          notes_args=(--generate-notes)
          if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then
            notes_args+=(--notes-start-tag "$previous")
          fi

          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Consolarr ${TAG}" \
            "${notes_args[@]}" \
            ./*.apk SHA256SUMS.txt SIGNING-CERT-SHA256.txt
          {
            echo "### Draft release created for ${TAG}"
            echo "Review it on the Releases page and publish it by hand."
          } >> "$GITHUB_STEP_SUMMARY"
