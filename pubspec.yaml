# SPDX-License-Identifier: GPL-3.0-or-later
name: consolarr_workspace
description: Consolarr monorepo workspace root (not published).
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - apps/consolarr
  - apps/consolarr_play
  - packages/core
  - packages/security
  - packages/arr_api
  - packages/torrent_clients
  - packages/design_system
  - packages/observability
  - packages/l10n
  - packages/test_harness

dev_dependencies:
  melos: ^8.10.1
  very_good_analysis: ^11.0.0

melos:
  scripts:
    analyze:
      description: Analyze the whole workspace (VGA lints + consolarr_lints); infos fail.
      run: dart analyze --fatal-infos .

    format:
      description: Format all Dart code.
      run: dart format .

    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --output=none --set-exit-if-changed .

    l10n:
      description: Merge per-feature ARB files, regenerate en_XA and run gen-l10n.
      run: dart run packages/l10n/tool/build_l10n.dart

    test:
      description: Run every package's unit, widget and golden tests with coverage.
      exec: flutter test --coverage
      packageFilters:
        dirExists: test

    test:lints:
      description: Run the custom lint rule tests (tools/consolarr_lints).
      run: cd tools/consolarr_lints && dart pub get && dart test

    goldens:update:
      description: Regenerate golden images (review the diff before committing).
      exec: flutter test --update-goldens
      packageFilters:
        dirExists: test/goldens

    spdx:
      description: Check SPDX headers.
      run: bash tools/ci/check_spdx.sh

    lint:canary:
      description: Prove the analyzer plugin is loaded (expects deliberate violations to be reported).
      run: bash tools/ci/lint_canary.sh

    build:debug:
      description: Debug APKs for both apps (no secrets needed).
      run: |
        melos exec --scope="consolarr,consolarr_play" -c 1 -- flutter build apk --debug

    build:release:
      description: Obfuscated, split-debug-info arm64 release APKs (debug-signed unless key.properties exists).
      run: |
        melos exec --scope="consolarr,consolarr_play" -c 1 -- flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/debug-info
