# Radarr area (RAD-*). Add Radarr events here; screens merge into screen_name.
# Parameters are enums, ints or bools only: no titles, paths or release names.
enums:
  screen_name:
    values:
      - radarr_library
      - radarr_movie_detail
      - radarr_calendar
      - radarr_queue
      - radarr_history
      - radarr_add_movie
      - radarr_interactive_search
      - radarr_missing
  radarr_search_kind_param:
    dart: RadarrSearchKindParam
    values: [movie, all_missing]
  radarr_removal_param:
    dart: RadarrRemovalParam
    values: [keep_in_client_no_blocklist, remove_no_blocklist, blocklist_and_search, blocklist_only]
events:
  radarr_movie_added:
    description: A movie was added to Radarr.
    params:
      search_after_add: {type: bool}
      with_collection: {type: bool}
  radarr_release_grabbed:
    description: A release from the interactive search was sent to the download client.
    params:
      was_rejected: {type: bool}
  radarr_search_started:
    description: An automatic movie search command was started.
    params:
      kind: {type: radarr_search_kind_param}
  radarr_queue_item_removed:
    description: A queue item was removed.
    params:
      removal: {type: radarr_removal_param}
