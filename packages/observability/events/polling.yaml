# Notifications-ready polling and change detection. Every name is prefixed
# poll_. Counts and closed enums only: no title, id or host is reportable.
enums:
  poll_change_param:
    dart: PollChangeParam
    values: [queue_item_completed, download_failed, torrent_finished]
events:
  poll_cycle_finished:
    description: One polling cycle over all servers finished; counts only.
    params:
      servers: {type: int}
      failed: {type: int}
      changes: {type: int}
  poll_change_detected:
    description: A completed or failed download was detected; the kind only.
    params:
      change: {type: poll_change_param}
